[project]
name = "ci-triage-agent"
version = "0.1.0"
description = "Triages failing CI runs on a real GitHub repo: classifies the failure, retrieves similar past fixes, and either patches real bugs or comments with its reasoning."
requires-python = ">=3.9"
dependencies = [
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "langchain-anthropic>=0.3",
    "langchain-community>=0.3",
    "langchain-huggingface>=0.1",
    "sentence-transformers>=3.0",
    "pydantic>=2",
    "faiss-cpu>=1.8",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent*", "eval*"]
